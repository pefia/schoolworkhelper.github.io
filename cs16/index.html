<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Counter-Strike 1.6</title>
  <link rel="icon" href="icon.svg">
  <style>
    :root{color-scheme:dark;--gold:#e8b84c;--panel:#111827;--muted:#aab4c5}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#05070b;color:#f8fafc;font-family:Inter,Segoe UI,sans-serif}
    body{display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid #303a49}
    .bar img{width:42px;height:42px}.bar h1{font-size:1rem;margin:0}.bar p{margin:3px 0 0;color:var(--muted);font-size:.78rem}.actions{margin-left:auto;display:flex;gap:8px}.bar a,.bar button{color:#15120a;background:var(--gold);padding:9px 14px;border:0;border-radius:9px;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.bar button{background:#dbe5f2}
    iframe{width:100%;height:100%;border:0;background:#0a0d12}.notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(620px,90vw);padding:9px 14px;border:1px solid #4b5563;border-radius:10px;background:#111827e8;color:var(--muted);font-size:.75rem;text-align:center;pointer-events:none}
  </style>
</head>
<body>
  <header class="bar">
    <img src="icon.svg" alt="">
    <div><h1>Counter-Strike 1.6 · WebXash</h1><p>Browser engine powered by the WebXash3D FWGS port</p></div>
    <div class="actions"><button id="install" type="button">Keep offline</button><a href="/games.html">Menu</a></div>
  </header>
  <iframe src="engine/index.html" allow="fullscreen; autoplay; gamepad; pointer-lock" title="Counter-Strike 1.6 WebXash game"></iframe>
  <p class="notice">The engine is open source; Counter-Strike game data remains Valve's property and may require files from a copy you own.</p>
  <script>
    const installButton = document.getElementById('install');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/cs16/sw.js', { scope: '/cs16/' });
    } else {
      installButton.hidden = true;
    }
    installButton.addEventListener('click', async () => {
      installButton.disabled = true;
      installButton.textContent = 'Saving…';
      try {
        const registration = await navigator.serviceWorker.ready;
        const worker = registration.active;
        if (!worker) throw new Error('The offline worker is not active');
        await new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          channel.port1.onmessage = ({ data }) => {
            if (data && data.ok) resolve();
            else reject(new Error(data && data.error ? data.error : 'Offline save failed'));
          };
          worker.postMessage({ type: 'CACHE_OFFLINE_ASSETS' }, [channel.port2]);
        });
        if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
        installButton.textContent = 'Saved offline';
      } catch (error) {
        installButton.disabled = false;
        installButton.textContent = 'Retry offline save';
      }
    });
  </script>
</body>
</html>
