<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Probability Grid Task</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1220;color:#e2e8f0;font-family:Arial,Helvetica,sans-serif;}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:16px;box-sizing:border-box;}
    h1{margin:0;font-size:1.3rem;color:#22d3ee;}
    .hud{display:flex;gap:24px;font-size:1rem;}
    .grid{display:grid;gap:2px;background:#1f3a52;padding:4px;border-radius:10px;touch-action:manipulation;}
    .cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;
      background:#33506b;border-radius:4px;cursor:pointer;user-select:none;font-size:1rem;}
    .cell.open{background:#04111d;cursor:default;}
    .cell.mine{background:#f87171;}
    .c1{color:#60a5fa}.c2{color:#34d399}.c3{color:#f87171}.c4{color:#a78bfa}.c5{color:#fbbf24}.c6{color:#22d3ee}.c7{color:#e2e8f0}.c8{color:#94a3b8}
    .hint{font-size:.8rem;color:#94a3b8;text-align:center;}
    button{padding:10px 18px;border:0;border-radius:999px;background:#22d3ee;color:#0b1220;font-weight:700;cursor:pointer;}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Probability Grid Task</h1>
  <div class="hud"><span>Flags: <b id="flags">0</b>/<b id="mines">0</b></span><span id="status">In progress</span></div>
  <div class="grid" id="grid"></div>
  <div class="hint">Left click reveal &middot; right click / long press to flag</div>
  <button id="restart">New Grid</button>
</div>
<script>
const SIZE=10,MINES=15;
const gridEl=document.getElementById('grid');
gridEl.style.gridTemplateColumns=`repeat(${SIZE},34px)`;
let cells,over,won,flags,opened;
function init(){
  over=false;won=false;flags=0;opened=0;
  document.getElementById('flags').textContent=0;
  document.getElementById('mines').textContent=MINES;
  document.getElementById('status').textContent='In progress';
  cells=[];gridEl.innerHTML='';
  for(let r=0;r<SIZE;r++){cells[r]=[];for(let c=0;c<SIZE;c++){
    const el=document.createElement('div');el.className='cell';
    const cell={el,r,c,mine:false,open:false,flag:false,n:0};
    el.onclick=()=>reveal(cell);
    el.oncontextmenu=e=>{e.preventDefault();flag(cell);};
    let timer;
    el.addEventListener('touchstart',()=>{timer=setTimeout(()=>{flag(cell);timer=null;},400);},{passive:true});
    el.addEventListener('touchend',e=>{if(timer){clearTimeout(timer);timer=null;}else e.preventDefault();});
    cells[r][c]=cell;gridEl.appendChild(el);
  }}
  let placed=0;
  while(placed<MINES){const r=Math.random()*SIZE|0,c=Math.random()*SIZE|0;
    if(!cells[r][c].mine){cells[r][c].mine=true;placed++;}}
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    let n=0;each(r,c,(rr,cc)=>{if(cells[rr][cc].mine)n++;});cells[r][c].n=n;}
}
function each(r,c,fn){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
  const rr=r+dr,cc=c+dc;if(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&!(dr===0&&dc===0))fn(rr,cc);}}
function reveal(cell){
  if(over||cell.open||cell.flag)return;
  cell.open=true;cell.el.classList.add('open');opened++;
  if(cell.mine){cell.el.classList.add('mine');cell.el.textContent='✸';end(false);return;}
  if(cell.n>0){cell.el.textContent=cell.n;cell.el.classList.add('c'+cell.n);}
  else each(cell.r,cell.c,(rr,cc)=>reveal(cells[rr][cc]));
  if(opened===SIZE*SIZE-MINES)end(true);
}
function flag(cell){
  if(over||cell.open)return;
  cell.flag=!cell.flag;cell.el.textContent=cell.flag?'⚑':'';
  flags+=cell.flag?1:-1;document.getElementById('flags').textContent=flags;
}
function end(win){
  over=true;won=win;
  document.getElementById('status').textContent=win?'Solved! 🎉':'Boom 💥';
  if(!win)for(const row of cells)for(const cell of row)
    if(cell.mine&&!cell.open){cell.el.classList.add('open','mine');cell.el.textContent='✸';}
}
document.getElementById('restart').onclick=init;
init();
</script>
</body>
</html>
